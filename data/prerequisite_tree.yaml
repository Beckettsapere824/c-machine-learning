meta:
  course: COMP3314 Introduction to Machine Learning
  instructor: Dong Xu
  design_principles:
    - Extremely fine-grained nodes; even elementary linear-algebra and calculus facts receive their own node
    - Every algorithm node contains the exact matrix formula, the gradient/closed-form derivation, and a short Python-style pseudocode
    - Explicit “why this math is required” notes so the learner never wastes time on unmotivated calculation
    - Heavy internal linking: algorithm nodes freely jump to the precise math node that is being used
    - Rich examples, geometric pictures, and “what goes wrong if you ignore this” warnings
    - Topological study order forces all mathematical prerequisites before any ML algorithm that uses them

modules:
  - id: M0
    name: Mathematical Foundations (heavily expanded)
    description: Vectors, matrices, norms, eigenvalues, multivariable calculus, convexity, Lagrange multipliers, KKT. These nodes are mandatory before any algorithm.
  - id: M1
    name: Supervised Learning Basics & Nearest Neighbors
  - id: M2
    name: Linear Models for Regression & Classification
  - id: M3
    name: Support Vector Machines
  - id: M4
    name: Dimensionality Reduction
  - id: M5
    name: Clustering
  - id: M6
    name: Ensemble Methods
  - id: M7
    name: Decision Trees
  - id: M8
    name: Neural Networks & Backpropagation

nodes:
  # ========== M0 Mathematical Foundations (expanded) ==========
  - id: M0.1
    name: Vectors, Inner Product, Euclidean Geometry
    module: M0
    prereq: []
    content: |
      Column vectors, addition, scalar multiplication, Euclidean inner product ⟨x,y⟩=xᵀy,
      length ||x||₂=√⟨x,x⟩, angle cosθ=⟨x,y⟩/(||x||||y||), orthogonal, Cauchy–Schwarz.
      Geometric picture of projection of one vector onto another.

  - id: M0.2
    name: Norms (ℓ1, ℓ2, ℓ∞) and Distance Metrics
    module: M0
    prereq: [M0.1]
    content: |
      Definition of a norm, ℓp norms, equivalence of norms in finite dimension,
      induced distance d(x,y)=||x-y||. Why different norms produce different nearest neighbors.

  - id: M0.3
    name: Matrices, Multiplication, Transpose, Block View
    module: M0
    prereq: [M0.1]
    content: |
      Matrix as linear map, matrix–vector product as linear combination of columns,
      matrix–matrix product, transpose identities (AB)ᵀ=BᵀAᵀ, symmetric matrices,
      viewing data matrix as collection of row or column vectors.

  - id: M0.4
    name: Rank, Column Space, Null Space, Invertibility
    module: M0
    prereq: [M0.3]
    content: |
      Rank-nullity theorem, full column/row rank, left/right inverses,
      when XᵀX is invertible (critical for normal equations).

  - id: M0.5
    name: Eigenvalues, Eigenvectors, Spectral Decomposition
    module: M0
    prereq: [M0.4]
    content: |
      Av=λv, characteristic polynomial, real symmetric ⇒ real eigenvalues + orthogonal eigenvectors,
      spectral theorem A=QΛQᵀ, Rayleigh quotient.

  - id: M0.6
    name: Positive (Semi)Definite Matrices & Quadratic Forms
    module: M0
    prereq: [M0.5]
    content: |
      xᵀAx ≥0 ∀x ⇔ all eigenvalues ≥0, convexity of quadratic forms,
      Cholesky factorisation, relation to covariance matrices.

  - id: M0.7
    name: Partial Derivatives and Gradient of a Scalar Function
    module: M0
    prereq: [M0.1]
    content: |
      Definition of partial derivative, gradient vector ∇f, directional derivative,
      geometric meaning (steepest ascent).

  - id: M0.8
    name: Matrix Calculus – Common Gradients
    module: M0
    prereq: [M0.3, M0.7]
    content: |
      ∇(aᵀx)=a, ∇(xᵀAx)=(A+Aᵀ)x, ∇||Ax-b||²=2Aᵀ(Ax-b),
      chain rule for vector-valued compositions. All formulas used later in closed form.

  - id: M0.9
    name: Convex Sets, Convex Functions, First-order Characterisation
    module: M0
    prereq: [M0.7]
    content: |
      Definition of convex set/function, Jensen, first-order condition f(y)≥f(x)+∇f(x)ᵀ(y-x),
      why convex problems have no bad local minima.

  - id: M0.10
    name: Unconstrained Optimality Condition (∇f=0)
    module: M0
    prereq: [M0.8, M0.9]
    content: |
      Necessary condition for local minimum, sufficient when f is convex or Hessian positive definite.

  - id: M0.11
    name: Equality-Constrained Optimisation & Lagrange Multipliers
    module: M0
    prereq: [M0.10]
    content: |
      Problem min f(w) s.t. hᵢ(w)=0, Lagrangian L=f+Σβᵢhᵢ,
      stationarity ∇_w L=0 and ∇_β L=0, geometric meaning (gradients aligned).

  - id: M0.12
    name: Inequality Constraints & KKT Conditions (preview)
    module: M0
    prereq: [M0.11]
    content: |
      Complementary slackness, primal/dual feasibility, KKT system.
      Directly used for soft-margin SVM.

