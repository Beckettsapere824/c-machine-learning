meta:
  course: COMP3314 Introduction to Machine Learning
  instructor: Dong Xu
  design_principles:
    - 每个节点必须有「思路」：给维护者/机器读的结构化教学路径，而不是内容摘要
    - 节点 Markdown 与 HTML 演示必须严格按照对应思路展开，引导读者理解，禁止百科式堆砌
    - 思路要回答：读者从哪来、核心问题是什么、按什么顺序建立直觉、哪里容易卡住、学完能独立做什么
    - 数学节点同样需要思路：从「为什么需要这个数学」开始，而不是直接丢定义

modules:
  - id: M0
    name: Mathematical Foundations
  - id: M1
    name: Supervised Learning Basics & Nearest Neighbors
  - id: M2
    name: Linear Models for Regression & Classification
  - id: M3
    name: Support Vector Machines
  - id: M4
    name: Dimensionality Reduction
  - id: M5
    name: Clustering
  - id: M6
    name: Ensemble Methods
  - id: M7
    name: Decision Trees
  - id: M8
    name: Neural Networks & Backpropagation

nodes:

  # ==================== M0 ====================
  - id: M0.1
    name: Vectors, Inner Product, Euclidean Geometry
    module: M0
    prereq: []
    思路:
      读者起点: "可能只记得中学向量加减，对「内积是角度与投影的桥梁」没有感觉。"
      核心问题: "机器如何用数字比较两个方向是否相似、一个点到一条线的投影是什么？"
      叙事路径:
        - "从具体物体出发：两个箭头，长度、夹角如何量化。"
        - "定义列向量与分量加减，立刻落到坐标纸上的例子。"
        - "引入内积公式，先算再解释：为什么这个和能同时编码长度与夹角。"
        - "推出长度公式、余弦公式、正交条件，每一步都回到几何图。"
        - "投影公式：把「影子」变成可计算的向量，为后续最近邻与回归打底。"
      必须建立的直觉:
        - "内积大 → 方向接近；内积零 → 垂直。"
        - "投影是「在某个方向上保留的成分」。"
      易错点: "把行向量与列向量混用；忘记归一化就谈夹角。"
      出口衔接: "有了长度，下一步就能定义「距离」，从而比较谁更近。"
      成功标准: "能手算两向量夹角与投影，并解释结果的几何含义。"

  - id: M0.2
    name: Norms (ℓ1, ℓ2, ℓ∞) and Distance Metrics
    module: M0
    prereq: [M0.1]
    思路:
      读者起点: "已会欧氏长度，可能默认「距离就是勾股定理」。"
      核心问题: "为什么换一种「尺子」会改变谁是最近邻？"
      叙事路径:
        - "先问：从家到公司，只许横平竖直走 vs 可以斜穿，路径长度一样吗？"
        - "引出范数公理（正定、齐次、三角），再给出 ℓ1/ℓ2/ℓ∞ 公式。"
        - "画单位球：菱形、圆、正方形，让读者看到「同样长度1」的点集形状完全不同。"
        - "用同一组点算三种距离，观察最近邻是否翻转。"
        - "结论：距离定义会改变算法行为，后续 k-NN、正则化都会用到。"
      必须建立的直觉: "范数决定几何形状，几何形状决定谁近谁远。"
      易错点: "以为所有范数给出相同排序；忽略特征量纲不同时必须先缩放。"
      出口衔接: "有了距离，就可以谈「最近的那个训练点」。"
      成功标准: "能解释为何曼哈顿距离与欧氏距离可能选出不同邻居，并手算小例子。"

  - id: M0.3
    name: Matrices, Multiplication, Transpose, Block View
    module: M0
    prereq: [M0.1]
    思路:
      读者起点: "可能只会按行列规则做乘法，不知道矩阵乘法在「说」什么。"
      核心问题: "矩阵乘法如何统一表达「线性组合」与「批量变换」？"
      叙事路径:
        - "把矩阵看成「一组列向量」：A x 就是用 x 的分量去线性组合这些列。"
        - "数据矩阵两种看法：行=样本，列=特征，后续所有公式都依赖这个视角。"
        - "转置的直观：行列互换，内积可写成 xᵀ y。"
        - "(AB)ᵀ=BᵀAᵀ 用「组合的逆序」理解，不要死记。"
      必须建立的直觉: "矩阵-向量 = 列的线性组合；数据矩阵是样本的堆叠。"
      易错点: "维度对不上还强行乘；把矩阵乘法当成逐元素乘法。"
      出口衔接: "列的线性组合有可能线性相关 → 引出秩与可逆性。"
      成功标准: "能把 A x 画成列的加权和，并能正确写出数据矩阵的维度含义。"

  - id: M0.4
    name: Rank, Column Space, Null Space, Invertibility
    module: M0
    prereq: [M0.3]
    思路:
      读者起点: "会做高斯消元，但不知道秩与「方程有没有唯一解」的关系。"
      核心问题: "什么时候 XᵀX 可逆？为什么这决定最小二乘有没有唯一闭式解？"
      叙事路径:
        - "用具体 2×2 与 3×2 矩阵，观察列是否互相成比例。"
        - "定义列空间、零空间，用图画「能到达的方向」与「被压扁的方向」。"
        - "秩-零度定理一句话串起来。"
        - "满列秩 ⇔ XᵀX 可逆，直接指向正规方程。"
      必须建立的直觉: "列线性相关 = 有冗余方向 = 解不唯一或无穷。"
      易错点: "混淆行秩与列秩；以为方阵就一定可逆。"
      出口衔接: "可逆性搞清后，才能安心写闭式解；不可逆时要正则化或伪逆。"
      成功标准: "给定小矩阵能判断满不满列秩，并说明对最小二乘意味着什么。"

  - id: M0.5
    name: Eigenvalues, Eigenvectors, Spectral Decomposition
    module: M0
    prereq: [M0.4]
    思路:
      读者起点: "可能背过特征方程，但没把「特征向量=拉伸方向」内化。"
      核心问题: "对称矩阵如何被正交坐标系「看清楚」？为什么 PCA 就是在找这些方向？"
      叙事路径:
        - "用 2D 椭圆：沿长轴拉、沿短轴压，这就是特征向量方向。"
        - "写出 Av=λv，强调「只缩放不旋转」。"
        - "对称 ⇒ 实特征值 + 正交特征向量，谱分解 A=QΛQᵀ。"
        - "Rayleigh 商：uᵀAu / uᵀu 的最大最小值就是最大最小特征值。"
      必须建立的直觉: "特征向量是矩阵的「固有轴」；特征值是沿该轴的伸缩倍数。"
      易错点: "以为所有矩阵都能正交对角化；忘记特征值可以重复。"
      出口衔接: "协方差矩阵是对称半正定的 → 下一节点正定与 PCA 直接用谱分解。"
      成功标准: "能对 2×2 对称矩阵手算特征对，并解释几何含义。"

  - id: M0.6
    name: Positive (Semi)Definite Matrices & Quadratic Forms
    module: M0
    prereq: [M0.5]
    思路:
      读者起点: "会算特征值，但不知道「正定」与优化凸性的关系。"
      核心问题: "为什么二次函数 xᵀAx 的「开口向上」由特征值符号决定？"
      叙事路径:
        - "从一元 ax² 开口方向谈起，推广到多元二次型。"
        - "定义 PSD/PD：对所有非零 x，xᵀAx ≥0 / >0。"
        - "等价条件：特征值全非负 / 全正。"
        - "联系到最小二乘 Hessian、SVM 对偶、协方差矩阵都是 PSD。"
      必须建立的直觉: "PSD = 二次型永不往下掉 = 优化问题没有坏的局部极小。"
      易错点: "把「有正特征值」当成正定（必须全部为正）。"
      出口衔接: "有了凸性语言，后面谈「梯度为零就是全局最优」才站得住。"
      成功标准: "能判断小矩阵是否 PSD，并解释对优化意味着什么。"

  - id: M0.7
    name: Partial Derivatives and Gradient of a Scalar Function
    module: M0
    prereq: [M0.1]
    思路:
      读者起点: "会算一元导数，对「方向」与「梯度是向量」模糊。"
      核心问题: "函数上升最快的方向是什么？如何用一个向量把它记下来？"
      叙事路径:
        - "一元：导数是斜率。二元：沿 x 方向、沿 y 方向的斜率 → 偏导。"
        - "把所有偏导排成向量 = 梯度。"
        - "方向导数 = 梯度与单位方向的内积 → 梯度指向最陡上升。"
        - "立刻联系：后面所有「沿着负梯度走」的算法都建立在这张图上。"
      必须建立的直觉: "梯度是「变化率地图」上的箭头，指向升高最快处。"
      易错点: "把梯度当成标量；混淆行向量/列向量约定。"
      出口衔接: "有了梯度，下一步是「复合函数的梯度」与「常用矩阵形式」。"
      成功标准: "能手算简单函数的梯度，并指出最陡上升方向。"

  - id: M0.8
    name: Matrix Calculus – Common Gradients
    module: M0
    prereq: [M0.3, M0.7]
    思路:
      读者起点: "会算分量偏导，但一遇到矩阵就想逐元素展开，又慢又易错。"
      核心问题: "如何像查乘法表一样直接写出 ‖Xw−y‖² 的梯度？"
      叙事路径:
        - "先承认：逐元素能算，但不可扩展。需要向量形式的「乘法表」。"
        - "三条恒等式逐条推导（不要只给结果）：线性、二次型、平方残差。"
        - "每条都用一个最小数值例子验证。"
        - "链式法则向量形式：为反向传播埋伏笔。"
        - "立刻应用到最小二乘：∇J = Xᵀ(Xw−y)，一行写完。"
      必须建立的直觉: "矩阵微积分是省事的记账法，不是新数学。"
      易错点: "对称与非对称时 2A vs A+Aᵀ 搞混；漏掉 1/2 导致多 2 倍。"
      出口衔接: "会写梯度后，才能谈「令梯度为零」与「沿负梯度走」。"
      成功标准: "不展开分量，直接写出平方损失与岭回归的梯度。"

  - id: M0.9
    name: Convex Sets, Convex Functions, First-order Characterisation
    module: M0
    prereq: [M0.7]
    思路:
      读者起点: "听说过凸优化「很好算」，但不知道好在哪里。"
      核心问题: "为什么凸函数没有坏的局部极小？一阶条件如何判断？"
      叙事路径:
        - "凸集：线段在集合内。凸函数：图像在弦的下方。"
        - "一阶刻画：函数始终在切平面上方。"
        - "推论：梯度为零的点一定是全局最小。"
        - "联系到最小二乘、逻辑回归、SVM 对偶都是凸的，所以放心用梯度方法。"
      必须建立的直觉: "凸 = 没有「陷阱」；局部最优 = 全局最优。"
      易错点: "把非凸当成凸；以为有梯度为零就一定是最小（需凸性或二阶条件）。"
      出口衔接: "下一节点专门把「∇f=0」写成可用的最优性条件。"
      成功标准: "能用一阶条件证明简单凸函数的全局最小点。"

  - id: M0.10
    name: Unconstrained Optimality Condition (∇f=0)
    module: M0
    prereq: [M0.8, M0.9]
    思路:
      读者起点: "会算梯度，但不确定「什么时候梯度为零就是答案」。"
      核心问题: "在什么条件下，解 ∇f=0 就得到我们想要的最优解？"
      叙事路径:
        - "必要：局部最小点（内点）梯度必为零。"
        - "充分：若再凸，则该点是全局最小。"
        - "用最小二乘走一遍：∇J=0 → 正规方程 → 唯一全局解。"
      必须建立的直觉: "凸问题里，驻点就是终点。"
      易错点: "在非凸问题上误以为驻点都是全局最优。"
      出口衔接: "无约束搞清后，加约束就需要拉格朗日。"
      成功标准: "能说明为何最小二乘的正规方程给出全局最优。"

  - id: M0.11
    name: Equality-Constrained Optimisation & Lagrange Multipliers
    module: M0
    prereq: [M0.10]
    思路:
      读者起点: "只会无约束极值，对「在曲面上看极值」陌生。"
      核心问题: "有等式约束时，最优性条件长什么样？为什么乘子会出来？"
      叙事路径:
        - "几何：目标梯度必须与约束梯度共线，否则还能沿约束面移动来降目标。"
        - "写出 Lagrangian，把共线条件变成 ∇_w L=0。"
        - "用简单例子（圆上最小 x²+y²）完整走一遍。"
        - "强调：这就是硬间隔 SVM 对偶推导的起点。"
      必须建立的直觉: "拉格朗日乘子 = 把约束「吸收」进目标的系数。"
      易错点: "漏写约束的梯度条件；符号弄反。"
      出口衔接: "等式搞定后，不等式约束需要 KKT 的互补松弛。"
      成功标准: "能对简单等式约束问题写出 Lagrangian 并解出驻点。"

  - id: M0.12
    name: Inequality Constraints & KKT Conditions (preview)
    module: M0
    prereq: [M0.11]
    思路:
      读者起点: "会等式约束，对「≤」约束何时起作用不清楚。"
      核心问题: "为什么有的约束「紧」、有的「松」？乘子何时必须为零？"
      叙事路径:
        - "不等式约束：可行域有边界。最优点可能在内部（约束不起作用）或边界上。"
        - "互补松弛：α·g=0，要么约束不起作用（α=0），要么在边界上（g=0）。"
        - "KKT 四条件列表，先不求全懂，只求「见到时不慌」。"
        - "预告：软间隔 SVM 的 0≤α≤C 正是 KKT 的体现。"
      必须建立的直觉: "只有活跃的约束才需要乘子来「顶住」。"
      易错点: "以为所有乘子都大于零；忽略对偶可行。"
      出口衔接: "数学工具齐了，可以进入真正的学习算法。"
      成功标准: "能叙述互补松弛的含义，并指出它在 SVM 里对应什么。"

  # ==================== M1 ====================
  - id: M1.1
    name: Distance Metrics & Nearest-Neighbor Rule
    module: M1
    prereq: [M0.1, M0.2]
    思路:
      读者起点: "刚结束数学，第一次接触「用数据做判断」。可能完全不知道分类问题在问什么。"
      核心问题: "如果我只能记住所有训练样本，来了一个新点，最朴素的预测方式是什么？"
      叙事路径:
        - "先抛具体情境：医院来了新病人，只有一张症状表和历史病例。你会怎么猜诊断？——找最像的历史病例。"
        - "把「像」量化：需要距离。回顾 M0.2，欧氏/曼哈顿等都可以。"
        - "形式化 1-NN：找距离最小的训练点，把它的标签给新点。"
        - "决策区域是什么形状？引入 Voronoi 图——每个训练点「占领」离它最近的区域。用 3～4 个点手画一次。"
        - "换距离定义，Voronoi 边界会变，因此「谁是邻居」会变。"
        - "小结：1-NN 是「记忆型」方法，没有训练阶段，但预测要扫全库。"
      必须建立的直觉:
        - "分类 = 在特征空间里给区域贴标签。"
        - "1-NN 的边界完全由训练点位置决定，对噪声敏感。"
      易错点: "一上来就写公式，读者还不知道问题是什么；把 Voronoi 当必须背的术语而不是画出来的图。"
      出口衔接: "一个邻居太脆弱 → 自然问：能不能看 k 个邻居投票？"
      成功标准: "能对小数据集手算 1-NN 预测，并画出大致决策边界；能解释换范数为何可能改预测。"

  - id: M1.2
    name: k-NN Classifier, Majority Vote, Distance-Weighted k-NN
    module: M1
    prereq: [M1.1]
    思路:
      读者起点: "已理解 1-NN，但担心单个噪声点会毁掉预测。"
      核心问题: "看多个邻居时，如何把他们的意见合成一个预测？k 取大取小有什么代价？"
      叙事路径:
        - "延续医院例子：最像的 1 个病例可能是个例，看最像的 5 个再投票更稳。"
        - "多数投票：k 个邻居里谁出现次数多听谁的。k 通常取奇数避免平票。"
        - "平票怎么办？预先规定破平规则（距离更近者优先、标签序等）。"
        - "再改进：更近的邻居应该更有话语权 → 距离加权（1/d 或高斯核）。手算一个 5 邻居例子，对比硬投票与加权结果可能不同。"
        - "偏差-方差：k=1 边界复杂（低偏差高方差），k 很大则边界平滑（高偏差低方差）。没有万能 k，靠验证集选。"
      必须建立的直觉: "k 是平滑旋钮；加权是「近的人说话更响」。"
      易错点: "只记公式不手算投票；忽略类别不平衡时多数投票的陷阱。"
      出口衔接: "高维时「近」变得没有意义 → 维度灾难。"
      成功标准: "能手算硬投票与距离加权投票；能用自己的话解释 k 对边界平滑度的影响。"

  - id: M1.3
    name: Curse of Dimensionality & Face-Recognition Pipeline
    module: M1
    prereq: [M1.2]
    思路:
      读者起点: "觉得 k-NN 已经可用，尚未意识到维度升高后距离会失效。"
      核心问题: "为什么像素向量直接丢给 k-NN 效果很差？高维里「近邻」还可靠吗？"
      叙事路径:
        - "思想实验：单位超立方体里随机撒点，维度升高后，最近邻与最远邻的距离比 → 1。所有点几乎一样远。"
        - "因此「最近」失去区分度。这就是维度灾难在距离上的表现。"
        - "人脸：100×100 灰度 = 10000 维，样本永远不够密。"
        - "工程出路：先降维（PCA/LDA）再 k-NN，把有效维度压到样本能支撑的程度。"
        - "经典流水线：检测→对齐→向量化→降维→分类。为 M4 埋钩子。"
      必须建立的直觉: "高维空间很空，距离趋同；必须降维或换模型。"
      易错点: "以为多加特征总是好事；忽略特征需要与样本量匹配。"
      出口衔接: "降维需要协方差与特征分解 → M4。"
      成功标准: "能解释为何高维 k-NN 会失效，并说出人脸流水线中降维的位置与原因。"

  # ==================== M2 ====================
  - id: M2.1
    name: Linear Regression – Model & Squared Loss
    module: M2
    prereq: [M0.8]
    思路:
      读者起点: "会距离与邻居，但想要一个「压缩」成公式的模型，而不是存全部数据。"
      核心问题: "如何用一条直线（超平面）近似输入到输出的关系？用什么标准衡量拟合好坏？"
      叙事路径:
        - "情境：根据面积预测房价。画散点，尝试画直线。"
        - "模型：y ≈ wᵀx（可含截距）。"
        - "残差：预测与真值的差。为何用平方？可微、惩罚大误差、与高斯噪声 MLE 一致。"
        - "经验风险 J(w)=½‖Xw−y‖²，矩阵形式一次写清。"
        - "强调：这是优化问题，下一步要么闭式解要么梯度下降。"
      必须建立的直觉: "学习 = 选参数让损失在训练集上变小。"
      易错点: "一上来就写正规方程，读者还不知道在最小化什么。"
      出口衔接: "J 对 w 可微 → 可令梯度为零或沿梯度走。"
      成功标准: "能写出带截距的设计矩阵与平方损失，并解释每个符号的含义。"

  - id: M2.2
    name: Normal Equations & Closed-Form Solution
    module: M2
    prereq: [M2.1, M0.4, M0.10]
    思路:
      读者起点: "知道要最小化平方损失，想要「一次算出来」的方法。"
      核心问题: "令梯度为零得到什么方程？何时有唯一解？几何上在做什么？"
      叙事路径:
        - "用 M0.8 直接写 ∇J = Xᵀ(Xw−y)=0 → 正规方程。"
        - "几何：Xw 是列空间中离 y 最近的点，残差与列空间正交。"
        - "满列秩 ⇔ 唯一解；否则伪逆给最短解。"
        - "完整数值小例子手算一遍。"
      必须建立的直觉: "正规方程 = 正交投影的代数形式。"
      易错点: "用求逆而不是 solve；忘记检查秩。"
      出口衔接: "闭式解在 n、d 很大时贵 → 迭代法；特征太少时要升维。"
      成功标准: "能从损失推出正规方程，并手算小规模例子。"

  - id: M2.3
    name: Polynomial Features & Overfitting
    module: M2
    prereq: [M2.2]
    思路:
      读者起点: "线性模型只能是直线，但真实关系可能弯曲。"
      核心问题: "如何让「线性」模型拟合曲线？阶数过高会怎样？"
      叙事路径:
        - "特征映射：把 x 变成 (1,x,x²,…)。在新空间里仍是线性，在原空间是曲线。"
        - "阶数升高，训练误差可降到 0，但测试点之间会剧烈振荡 → 过拟合。"
        - "偏差-方差权衡的具体图像：低阶欠拟合，高阶过拟合。"
        - "出路预告：正则化、交叉验证选阶数。"
      必须建立的直觉: "模型能力越强越容易背答案；要在拟合与平滑之间折中。"
      易错点: "以为训练误差低就好；忽略数值上高次幂导致的病态。"
      出口衔接: "大矩阵闭式解贵 → 梯度下降。"
      成功标准: "能解释为何高次多项式会过拟合，并画出示意。"

  - id: M2.4
    name: Gradient Descent for Least Squares
    module: M2
    prereq: [M2.1, M0.8, M0.10]
    思路:
      读者起点: "会正规方程，但 n 或 d 很大时存不下/算不动 XᵀX。"
      核心问题: "如何只用电梯度信息一步步走到最小点？步长如何选？"
      叙事路径:
        - "下山类比：每步沿最陡下坡方向走一小步。"
        - "公式：w ← w − η∇J，∇J 已由 M0.8 给出。"
        - "批量 / 随机 / 小批量：稳定性与速度的权衡。"
        - "步长过大发散、过小龟速；二次函数有理论安全上限 2/λ_max。"
      必须建立的直觉: "迭代法用计算时间换矩阵分解的内存与复杂度。"
      易错点: "不归一化特征导致步长极难调；把 SGD 噪声当成 bug。"
      出口衔接: "同样的梯度思路可推广到分类损失。"
      成功标准: "能实现一个批量 GD 伪代码，并说明 η 过大过小的现象。"

  - id: M2.5
    name: Perceptron Learning Rule
    module: M2
    prereq: [M0.1, M0.8]
    思路:
      读者起点: "回归会了，现在标签是 ±1，想要分类。"
      核心问题: "最简单的线性分类器如何根据对错更新自己？"
      叙事路径:
        - "阈值：wᵀx 的符号作为预测。"
        - "错了就罚：把误分类点「推过」边界 → w ← w + y_i x_i。"
        - "线性可分时有限步收敛；不可分则来回抖。"
        - "与梯度下降的联系：感知机损失的次梯度更新。"
      必须建立的直觉: "只在犯错时学习；可分则停，不可分则振荡。"
      易错点: "以为感知机总能收敛；忽略偏置项。"
      出口衔接: "硬阈值不可微 → 换成连续输出与可微损失（Adaline）。"
      成功标准: "能手推一次感知机更新，并说明收敛条件。"

  - id: M2.6
    name: Adaline & Continuous Activation
    module: M2
    prereq: [M2.5, M2.1]
    思路:
      读者起点: "感知机只看对错，不看「错得多离谱」。"
      核心问题: "如果输出改成连续值并用平方损失，更新规则变成什么？"
      叙事路径:
        - "激活改为恒等，损失改为平方 → 与最小二乘相同。"
        - "因此可用全批量梯度或 SGD，且在不可分数据上也会收敛到某个最小点。"
        - "最终分类仍取符号。对比感知机：Adaline 每步都更新，感知机只在错误时更新。"
      必须建立的直觉: "可微损失让优化工具（GD）可以直接用。"
      易错点: "把 Adaline 与感知机的更新条件混淆。"
      出口衔接: "平方损失对分类不是最自然 → 概率与交叉熵。"
      成功标准: "能对比感知机与 Adaline 的损失与更新时机。"

  - id: M2.7
    name: Logistic Regression – Model & Cross-Entropy Loss
    module: M2
    prereq: [M2.6, M0.8]
    思路:
      读者起点: "想要的是「属于正类的概率」，而不是无界的分数。"
      核心问题: "如何把线性分数压到 (0,1)？如何定义与概率匹配的损失？"
      叙事路径:
        - "sigmoid 把实数映射到概率。"
        - "极大似然 → 最小化交叉熵。"
        - "梯度神奇地又是 Xᵀ(σ−y)，与最小二乘同形。"
        - "凸性保证全局最优。"
      必须建立的直觉: "分类也可以是概率模型；交叉熵惩罚「很自信的错误」。"
      易错点: "把 σ 的梯度推错；用平方损失做分类。"
      出口衔接: "两类推广到多类 → softmax。"
      成功标准: "能写出逻辑回归的损失与梯度，并解释为何用交叉熵。"

  - id: M2.8
    name: Multiclass Softmax & Cross-Entropy
    module: M2
    prereq: [M2.7]
    思路:
      读者起点: "两类会了，标签有 K 个。"
      核心问题: "如何把 K 个分数变成 K 类概率并定义损失？"
      叙事路径:
        - "每类一个权重向量，得到 K 个分数。"
        - "softmax 归一化成概率。"
        - "交叉熵梯度 = p − onehot，形式干净。"
        - "这正是神经网络最后一层的标准配置。"
      必须建立的直觉: "多类 = 一类一个线性函数 + 共享的归一化。"
      易错点: "数值上 softmax 溢出，需减最大值稳定。"
      出口衔接: "线性分类器叠起来 + 非线性 = 神经网络。"
      成功标准: "能写出 softmax 概率与交叉熵对分数的梯度。"

  # ==================== M3 ====================
  - id: M3.1
    name: Maximum-Margin Hyperplane (Hard Margin)
    module: M3
    prereq: [M0.1, M0.6]
    思路:
      读者起点: "会线性分类，但感觉「刚好分开」的边界不唯一，哪条更好？"
      核心问题: "在所有能分开数据的超平面里，哪一条对噪声最不敏感？"
      叙事路径:
        - "画两类点，多条分界线都能分开，中间那条「留白最大」的更安全。"
        - "定义几何间隔，最大化间隔 ⇔ 最小化 ‖w‖²（在函数间隔≥1 约束下）。"
        - "得到硬间隔原问题。强调：这是凸二次规划。"
        - "支持向量 = 贴在间隔边界上的点。"
      必须建立的直觉: "大间隔 = 鲁棒；只有贴边的点真正起作用。"
      易错点: "把函数间隔与几何间隔混为一谈。"
      出口衔接: "原问题有约束，用拉格朗日转对偶，且只依赖内积。"
      成功标准: "能陈述硬间隔原问题，并指出支持向量的几何位置。"

  - id: M3.2
    name: Hard-Margin Dual Derivation
    module: M3
    prereq: [M3.1, M0.11]
    思路:
      读者起点: "知道原问题，但想看「为什么最终只依赖支持向量与内积」。"
      核心问题: "如何从原问题推出对偶，并看到 w 是训练点的线性组合？"
      叙事路径:
        - "写 Lagrangian（回顾 M0.11）。"
        - "对 w、b 求驻点 → w=Σ α_i y_i x_i，Σ α_i y_i=0。"
        - "代回得到只含内积的对偶目标。"
        - "α_i>0 的点 = 支持向量。与演示呼应。"
      必须建立的直觉: "对偶把「约束」变成「样本权重」；稀疏性来自 KKT。"
      易错点: "漏掉 Σ α y =0；符号错误。"
      出口衔接: "可分假设太强 → 软间隔；内积可换成核。"
      成功标准: "能独立写出从原问题到对偶目标的关键步骤。"

  - id: M3.3
    name: Soft-Margin SVM & Slack Variables
    module: M3
    prereq: [M3.2, M0.12]
    思路:
      读者起点: "现实数据几乎总有重叠，硬间隔无解。"
      核心问题: "如何允许少量犯错，同时仍尽量保持大间隔？"
      叙事路径:
        - "引入松弛变量 ξ≥0，约束变成 ≥1−ξ。"
        - "目标加 C Σξ：C 大 → 少容忍错；C 小 → 更平滑。"
        - "对偶中 α 被限制在 [0,C]。"
        - "铰链损失视角：软间隔 = 正则化铰链损失最小化。"
      必须建立的直觉: "C 是「间隔」与「容忍噪声」的旋钮。"
      易错点: "以为软间隔一定处处可分；把 C 当学习率。"
      出口衔接: "对偶只含内积 → 核技巧。"
      成功标准: "能解释 C 的作用，并写出软间隔原问题。"

  - id: M3.4
    name: Kernel Trick & Positive-Definite Kernels
    module: M3
    prereq: [M3.2, M0.6]
    思路:
      读者起点: "线性分不了的数据，想升维，但显式升维太贵。"
      核心问题: "如何在不算出 φ(x) 的情况下，使用高维甚至无限维特征？"
      叙事路径:
        - "对偶里数据只以 ⟨x_i,x_j⟩ 出现。"
        - "把内积换成 k(x,z)=⟨φ(x),φ(z)⟩，若 k 好算就无需 φ。"
        - "Mercer：核矩阵必须 PSD。"
        - "常用核：线性、多项式、RBF。RBF 对应无限维。"
      必须建立的直觉: "核 = 隐式特征空间里的内积；计算在原空间完成。"
      易错点: "使用不保证 PSD 的「相似度」当核。"
      出口衔接: "解仍在训练点张成的空间里 → 表示定理。"
      成功标准: "能说明为何对偶+核可以不显式升维，并举一个核例子。"

  - id: M3.5
    name: Representer Theorem intuition & Kernel Decision Function
    module: M3
    prereq: [M3.4]
    思路:
      读者起点: "特征空间可能无限维，解会不会也要无限个参数？"
      核心问题: "为什么最优解一定能写成训练点的有限线性组合？"
      叙事路径:
        - "把 w 分解成训练点张成空间内的部分 + 正交补。"
        - "正则项惩罚正交补，数据项与正交补无关 → 最优时正交补为零。"
        - "因此 f(x)=Σ α_i y_i k(x_i,x)+b，预测只依赖支持向量。"
      必须建立的直觉: "正则化迫使解落在数据张成的有限维子空间。"
      易错点: "以为核方法参数量与特征维数有关（其实与样本数有关）。"
      出口衔接: "SVM 告一段落；降维与无监督换一条线。"
      成功标准: "能用自己的话叙述表示定理为何成立，并写出核决策函数。"

  # ==================== M4 ====================
  - id: M4.1
    name: Covariance Matrix & Empirical Second-Moment
    module: M4
    prereq: [M0.3, M0.6]
    思路:
      读者起点: "高维数据坐标轴是任意的，想找到「变化最大」的方向。"
      核心问题: "如何用一个矩阵刻画数据在各个方向上的波动程度？"
      叙事路径:
        - "中心化：先减均值，只关心形状。"
        - "协方差矩阵 Σ = (1/n) X̃ᵀX̃，(j,k) 元是特征 j 与 k 的协方差。"
        - "uᵀΣu = 数据投影到 u 后的方差。"
        - "Σ 一定 PSD。"
      必须建立的直觉: "协方差矩阵 = 数据的「形状」；二次型 = 某方向上的方差。"
      易错点: "忘记中心化；混用 1/n 与 1/(n−1)。"
      出口衔接: "最大化 uᵀΣu 就得到 PCA。"
      成功标准: "能写出中心化后协方差公式，并解释 uᵀΣu 的含义。"

  - id: M4.2
    name: PCA – Principal Axes via Eigendecomposition
    module: M4
    prereq: [M4.1, M0.5]
    思路:
      读者起点: "知道方差可用 uᵀΣu 表示，想找最大方差方向。"
      核心问题: "最大方差方向与 Σ 的特征向量有何关系？丢掉小特征值损失多少？"
      叙事路径:
        - "约束 ‖u‖=1 下最大化 uᵀΣu → Rayleigh → 最大特征值对应的特征向量。"
        - "第二主轴在正交补里再最大化，依次得到全部主轴。"
        - "谱分解一次性给出全部。"
        - "重构误差 = 被丢弃的特征值之和。"
      必须建立的直觉: "PCA = 协方差的特征分解；主轴按方差排序。"
      易错点: "在未中心化数据上做 PCA；以为主成分一定可解释。"
      出口衔接: "算法细节、白化、人脸特征脸。"
      成功标准: "能说明为何主轴是特征向量，以及截断误差的含义。"

  - id: M4.3
    name: PCA – Algorithm, Whitening, Eigenfaces
    module: M4
    prereq: [M4.2]
    思路:
      读者起点: "理论会了，想看实际步骤与经典应用。"
      核心问题: "从原始像素到低维系数，中间有哪些工程步骤？特征脸是什么？"
      叙事路径:
        - "流程：中心化 → 特征分解（或 SVD）→ 取前 k 个 → 投影。"
        - "白化：再除 √λ，让各向方差为 1。"
        - "特征脸：特征向量还原成图像形状，可视化「主要变化模式」。"
        - "与 M1.3 流水线闭环。"
      必须建立的直觉: "特征脸是数据驱动的一组基底，不是人工设计的。"
      易错点: "k 选太大仍过拟合噪声；忽略对齐对特征脸的影响。"
      出口衔接: "PCA 无监督；有标签时想让投影后类更可分 → LDA。"
      成功标准: "能口述 PCA 流水线，并解释特征脸可视化在看什么。"

  - id: M4.4
    name: LDA – Fisher Criterion
    module: M4
    prereq: [M4.1, M0.5]
    思路:
      读者起点: "PCA 保方差，但大方差方向不一定对分类有用。"
      核心问题: "有标签时，如何选投影方向让类间远、类内紧？"
      叙事路径:
        - "定义类间散度 S_B、类内散度 S_W。"
        - "Fisher 准则 J(u)= (uᵀS_B u)/(uᵀS_W u)。"
        - "直观：分子大 = 类中心远离；分母小 = 类内聚拢。"
      必须建立的直觉: "有监督降维的目标与无监督不同。"
      易错点: "把 LDA 当成分类器本身（它主要是投影）。"
      出口衔接: "最大化 Fisher 准则 → 广义特征值问题。"
      成功标准: "能写出 Fisher 准则并解释分子分母的含义。"

  - id: M4.5
    name: LDA – Generalized Eigenvalue Problem
    module: M4
    prereq: [M4.4]
    思路:
      读者起点: "知道要最大化比值，不知道怎么算。"
      核心问题: "S_B u = λ S_W u 从何而来？最多有多少有用方向？"
      叙事路径:
        - "对 Fisher 准则求导或用广义 Rayleigh → 广义特征方程。"
        - "S_W 可逆时变成普通特征问题。"
        - "C 类最多 C−1 个非零方向。"
        - "高维小样本：先 PCA 再 LDA（Fisherfaces）。"
      必须建立的直觉: "有用投影维数受类别数限制。"
      易错点: "S_W 奇异时硬求逆。"
      出口衔接: "有监督/无监督降维告一段落，进入聚类。"
      成功标准: "能写出广义特征方程，并说明维数上界。"

  # ==================== M5 ====================
  - id: M5.1
    name: k-Means Objective & Lloyd Algorithm
    module: M5
    prereq: [M0.1, M0.2]
    思路:
      读者起点: "没有标签，想把相似的点分到一堆。"
      核心问题: "如何定义「堆内够紧」并交替优化归属与中心？"
      叙事路径:
        - "目标：最小化到各自中心的平方距离和。"
        - "固定中心 → 每点归最近中心；固定归属 → 中心取均值。"
        - "交替必降目标，有限步停于局部最优。"
        - "初始化敏感 → 下节 k-means++。"
      必须建立的直觉: "聚类 = 交替的归属与代表点更新。"
      易错点: "以为得到的是全局最优；忽略要标准化特征。"
      出口衔接: "初始化与空簇问题。"
      成功标准: "能描述 Lloyd 两步，并说明为何单调下降。"

  - id: M5.2
    name: k-Means++ Initialization & Practical Issues
    module: M5
    prereq: [M5.1]
    思路:
      读者起点: "随机初始化经常得到很差的局部解。"
      核心问题: "如何让初始中心尽量分散？实际还会遇到哪些坑？"
      叙事路径:
        - "D² 抽样：已有中心越远的点越容易被选为新中心。"
        - "理论：期望代价 O(log k) 近似。"
        - "空簇、k 的选择、特征尺度。"
      必须建立的直觉: "好的初始化是算法的一部分，不是细节。"
      易错点: "k 选成与真实结构无关的数还硬解释。"
      出口衔接: "层次方法提供另一种不预设 k 的视角。"
      成功标准: "能描述 k-means++ 的抽样方式与动机。"

  - id: M5.3
    name: Hierarchical Agglomerative Clustering & Linkages
    module: M5
    prereq: [M0.1, M0.2]
    思路:
      读者起点: "想看到「谁先和谁合并」的层次，而不只是平铺的 k 簇。"
      核心问题: "合并时如何定义两簇之间的距离？不同定义如何影响树形状？"
      叙事路径:
        - "自底向上：每点一簇，不断合并最近的两簇。"
        - "单链/全链/平均/Ward 的定义与直观。"
        - "树状图读取方式。"
        - "单链易被噪声桥连接，Ward 更倾向紧凑簇。"
      必须建立的直觉: "linkage 选择 = 对「簇形状」的先验。"
      易错点: "只看最后切一刀，忽略整棵树信息。"
      出口衔接: "如何评价聚类好坏。"
      成功标准: "能解释至少两种 linkage 的区别与适用场景。"

  - id: M5.4
    name: Cluster Validity Indices
    module: M5
    prereq: [M5.1, M5.3]
    思路:
      读者起点: "跑出了簇，不知道好不好，也不知道 k 选得对不对。"
      核心问题: "没有标签时用什么分数？有标签时如何与真值比？"
      叙事路径:
        - "内部：轮廓系数、Davies–Bouldin。"
        - "外部：ARI、NMI。"
        - "强调：指标是参考，不是真理；可视化仍然重要。"
      必须建立的直觉: "评价与目标函数相关，换指标可能换结论。"
      易错点: "只优化轮廓系数导致过度平滑的簇。"
      出口衔接: "无监督告一段落，进入集成。"
      成功标准: "能说出一种内部与一种外部指标的含义。"

  # ==================== M6 ====================
  - id: M6.1
    name: Majority / Plurality Voting & Weighted Voting
    module: M6
    prereq: []
    思路:
      读者起点: "单个模型会犯错，想结合多个意见。"
      核心问题: "多个分类器如何合成一个预测？"
      叙事路径:
        - "硬投票：少数服从多数。"
        - "软投票：平均概率。"
        - "加权：表现好的模型话语权更大。"
      必须建立的直觉: "独立错误可互相抵消。"
      易错点: "模型高度相关时投票收益很小。"
      出口衔接: "如何系统化地制造「有差异」的模型 → Bagging。"
      成功标准: "能区分硬投票与软投票，并手算小例子。"

  - id: M6.2
    name: Bagging (Bootstrap Aggregating)
    module: M6
    prereq: [M6.1]
    思路:
      读者起点: "想要一组有差异的模型，但只有一份数据。"
      核心问题: "自助采样如何制造差异？为何主要降方差？"
      叙事路径:
        - "有放回采样得到多份训练集，各训一个模型，再投票/平均。"
        - "基学习器高方差（深树）时收益大。"
        - "随机森林 = Bagging + 特征随机子集。"
      必须建立的直觉: "平均多个嘈杂估计 → 更稳。"
      易错点: "对已经很稳的模型做 Bagging 收益有限。"
      出口衔接: "Bagging 并行降方差；Boosting 串行降偏差。"
      成功标准: "能描述 Bagging 流程并说明它主要影响偏差还是方差。"

  - id: M6.3
    name: Boosting Idea & AdaBoost Derivation
    module: M6
    prereq: [M6.1, M2.7]
    思路:
      读者起点: "想让模型更关注上次错的样本。"
      核心问题: "如何通过重加权把弱学习器加成强学习器？α 与权重更新从哪来？"
      叙事路径:
        - "指数损失与 0-1 损失的关系。"
        - "固定已有组合，只优化下一个弱学习器及其系数 → 得到 α=½ln((1−ε)/ε)。"
        - "权重更新公式：错的升权，对的降权。"
        - "最终符号(Σ α_t h_t)。"
      必须建立的直觉: "Boosting = 聚焦难点；弱学习器只需略好于随机。"
      易错点: "把 AdaBoost 当成一定不会过拟合（实际仍可能）。"
      出口衔接: "树模型既可 Bagging 也可 Boosting。"
      成功标准: "能叙述 AdaBoost 一轮的步骤，并写出 α 公式。"

  # ==================== M7 ====================
  - id: M7.1
    name: Entropy & Information Gain
    module: M7
    prereq: []
    思路:
      读者起点: "想按特征提问来区分标签，需要「问哪个问题最有价值」的度量。"
      核心问题: "如何量化一组标签的混乱程度？分裂后混乱降了多少？"
      叙事路径:
        - "纯集合熵为 0，均匀分布熵最大。"
        - "信息增益 = 分裂前熵 − 分裂后加权平均熵。"
        - "增益大 = 该特征把不同标签分得更开。"
      必须建立的直觉: "学习过程可以看成不断降低不确定性。"
      易错点: "增益偏向取值多的特征（后面可用增益率）。"
      出口衔接: "Gini 是另一种不纯度，计算更省。"
      成功标准: "能手算小数据集的熵与信息增益。"

  - id: M7.2
    name: Gini Impurity
    module: M7
    prereq: [M7.1]
    思路:
      读者起点: "会熵，想看工业界常用的替代。"
      核心问题: "Gini 与熵的差别在哪？为何 CART 爱用 Gini？"
      叙事路径:
        - "Gini=1−Σ p²，同样在纯时为 0。"
        - "与熵形状相似，但不需要对数，算得快。"
        - "实践中两者选出的树往往接近。"
      必须建立的直觉: "不纯度度量可以换，目标都是「越纯越好」。"
      易错点: "以为 Gini 与熵会给出本质不同的树。"
      出口衔接: "有了不纯度，可以递归选分裂。"
      成功标准: "能算 Gini，并与熵对比同一数据集。"

  - id: M7.3
    name: CART / ID3 Recursive Partitioning
    module: M7
    prereq: [M7.1, M7.2]
    思路:
      读者起点: "知道怎么衡量一次分裂好坏，想看整棵树怎么长出来。"
      核心问题: "递归分裂的停止条件是什么？连续特征如何找阈值？"
      叙事路径:
        - "每个节点枚举特征（连续则枚举中点），选不纯度下降最大的分裂。"
        - "停止：纯、样本太少、深度上限。"
        - "轴对齐矩形划分，可解释但易过拟合。"
      必须建立的直觉: "树 = 用轴对齐墙不断切空间。"
      易错点: "连续特征枚举所有可能阈值导致极慢（需排序一次）。"
      出口衔接: "长满的树过拟合 → 剪枝与集成。"
      成功标准: "能描述一棵树的生成步骤，并手算一个浅树。"

  - id: M7.4
    name: Overfitting, Pruning, Tree Ensembles Preview
    module: M7
    prereq: [M7.3]
    思路:
      读者起点: "树在训练集上可以做到零错误，但测试很差。"
      核心问题: "如何砍掉不可靠的枝？树与集成有何关系？"
      叙事路径:
        - "预剪枝 vs 后剪枝（代价复杂度）。"
        - "单树高方差 → Bagging 成随机森林；Boosting 成梯度提升树。"
      必须建立的直觉: "剪枝换泛化；集成换稳定性。"
      易错点: "剪太狠欠拟合；只调深度不看叶节点样本数。"
      出口衔接: "进入神经网络：可微、可叠层的另一条路线。"
      成功标准: "能说明为何要剪枝，并说出随机森林与提升树的基本思想。"

  # ==================== M8 ====================
  - id: M8.1
    name: Multilayer Perceptron & Activation Functions
    module: M8
    prereq: [M2.7, M0.8]
    思路:
      读者起点: "线性模型表达能力有限，想叠加非线性。"
      核心问题: "一层线性+激活能做什么？为何需要多层？常用激活有何差别？"
      叙事路径:
        - "一层：仿射 + 逐元素非线性。"
        - "纯线性叠加仍是线性 → 必须有激活。"
        - "sigmoid/tanh/ReLU 的形状与梯度特性。"
        - "万能近似：单隐层足够宽可逼近连续函数；深度往往更省参数。"
      必须建立的直觉: "非线性激活是表达能力的来源。"
      易错点: "全部用线性激活；sigmoid 深层饱和。"
      出口衔接: "前向如何组织成计算图。"
      成功标准: "能解释为何需要激活，并对比至少两种激活的特点。"

  - id: M8.2
    name: Computational Graph & Forward Pass
    module: M8
    prereq: [M8.1]
    思路:
      读者起点: "会写一层公式，多层嵌套后导数很乱。"
      核心问题: "如何把网络表示成可自动求导的图？前向要缓存什么？"
      叙事路径:
        - "节点=运算，边=数值。拓扑序计算 = 前向。"
        - "缓存中间值，为反向做准备。"
        - "矩阵形式一层：Z=HW+b，H=φ(Z)。"
      必须建立的直觉: "图把复杂公式拆成可本地处理的小步骤。"
      易错点: "不缓存导致反向无法算；原地覆盖中间值。"
      出口衔接: "反向 = 在图上反向用链式法则。"
      成功标准: "能画一个两层网络的简单计算图并标出前向顺序。"

  - id: M8.3
    name: Backpropagation – Chain Rule on Graphs
    module: M8
    prereq: [M8.2, M0.8]
    思路:
      读者起点: "会标量链式法则，对「矩阵/向量版」和「从损失往回推」不熟。"
      核心问题: "如何高效计算损失对每一个参数的梯度？"
      叙事路径:
        - "反向模式自动微分：从损失开始，每个节点乘本地雅可比。"
        - "线性层与逐元素激活的伴随公式（用 M0.8）。"
        - "代价与参数量几乎无关，只与前向代价同量级。"
        - "小例子完整手算一遍数值。"
      必须建立的直觉: "反向传播 = 图上的链式法则记账，不是魔法。"
      易错点: "维度转置弄反；忘记激活的局部导数。"
      出口衔接: "有了梯度，就能套训练循环。"
      成功标准: "能对一个极小网络手算反向步骤，并对照自动微分结果。"

  - id: M8.4
    name: Training Loop, Mini-batch SGD, Practical Tricks
    module: M8
    prereq: [M8.3, M2.4]
    思路:
      读者起点: "会算梯度，但把网络真正训起来还有一堆工程细节。"
      核心问题: "一轮训练循环长什么样？学习率、初始化、正则化各自解决什么问题？"
      叙事路径:
        - "循环：取 batch → 前向 → 损失 → 反向 → 更新。"
        - "学习率调度：前期大后期小。"
        - "初始化：避免激活方差爆炸/消失。"
        - "正则：权重衰减、dropout、数据增强。"
        - "监控训练/验证曲线判断欠拟合过拟合。"
      必须建立的直觉: "训练成功 = 算法 + 初始化 + 调度 + 正则的系统工程。"
      易错点: "学习率固定太大；不看验证集只看训练损失。"
      出口衔接: "核心课程闭环；可回到任意节点加深或加专题。"
      成功标准: "能写出完整训练伪代码，并解释至少两个实用技巧的动机。"

